[versions]
agp = "9.4.1"
kotlin = "2.4.21"
coreKtx = "1.19.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
openmapview = "0.24.0"
ktor = "3.6.0"
